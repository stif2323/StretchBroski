<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymbroski Stretch Guide</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #F9FAFB; /* Tailwind gray-50 */
            -webkit-tap-highlight-color: transparent;
        }

        /* Timer pulse animation for active state */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes pulse-ring-rest {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .timer-active {
            animation: pulse-ring 2s infinite;
            border-color: #10B981; /* Emerald 500 */
            color: #10B981;
        }

        .timer-rest {
            animation: pulse-ring-rest 2s infinite;
            border-color: #F59E0B; /* Amber 500 */
            color: #F59E0B;
        }

        .timer-paused {
            border-color: #EF4444; /* Red 500 */
            color: #EF4444;
        }
        
        .timer-idle {
            border-color: #374151; /* Gray 700 */
            color: #F3F4F6; /* Gray 100 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- HEADER -->
    <header class="w-full max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center justify-center gap-3">
            <i class="fa-solid fa-dumbbell text-emerald-500"></i>
            GYMBROSKI STRETCH
        </h1>
        <p class="text-gray-400 mt-2 text-sm">Post-Workout Recovery Protocol</p>
    </header>

    <!-- ROUTINE SELECTOR -->
    <div id="selector-screen" class="w-full max-w-2xl flex flex-col gap-4 transition-all duration-500">
        <h2 class="text-xl font-semibold mb-2 text-center">Seleziona la scheda di oggi:</h2>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="app.selectRoutine('Torso A')" class="bg-gray-800 hover:bg-emerald-600 border border-gray-700 rounded-xl p-6 transition-colors shadow-lg flex flex-col items-center gap-2 group">
                <i class="fa-solid fa-child-reaching text-2xl text-gray-400 group-hover:text-white transition-colors"></i>
                <span class="font-bold text-lg">Torso A</span>
            </button>
            <button onclick="app.selectRoutine('Limbs A')" class="bg-gray-800 hover:bg-emerald-600 border border-gray-700 rounded-xl p-6 transition-colors shadow-lg flex flex-col items-center gap-2 group">
                <i class="fa-solid fa-shoe-prints text-2xl text-gray-400 group-hover:text-white transition-colors"></i>
                <span class="font-bold text-lg">Limbs A</span>
            </button>
            <button onclick="app.selectRoutine('Torso B')" class="bg-gray-800 hover:bg-emerald-600 border border-gray-700 rounded-xl p-6 transition-colors shadow-lg flex flex-col items-center gap-2 group">
                <i class="fa-solid fa-person-arrow-up-from-line text-2xl text-gray-400 group-hover:text-white transition-colors"></i>
                <span class="font-bold text-lg">Torso B</span>
            </button>
            <button onclick="app.selectRoutine('Limbs B')" class="bg-gray-800 hover:bg-emerald-600 border border-gray-700 rounded-xl p-6 transition-colors shadow-lg flex flex-col items-center gap-2 group">
                <i class="fa-solid fa-person-running text-2xl text-gray-400 group-hover:text-white transition-colors"></i>
                <span class="font-bold text-lg">Limbs B</span>
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Hidden initially) -->
    <div id="dashboard-screen" class="w-full max-w-2xl hidden flex-col items-center">
        
        <!-- Top bar (Back button & Progress) -->
        <div class="w-full flex justify-between items-center mb-6">
            <button onclick="app.goBack()" class="text-gray-400 hover:text-white transition-colors px-3 py-1 rounded bg-gray-800">
                <i class="fa-solid fa-arrow-left mr-2"></i> Indietro
            </button>
            <div id="progress-indicator" class="font-semibold text-emerald-400 bg-emerald-900/30 px-4 py-1 rounded-full text-sm">
                Esercizio 1 di 4
            </div>
        </div>

        <!-- Exercise Info Card -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full shadow-xl mb-8 relative overflow-hidden">
            <!-- Phase Badge -->
            <div id="phase-badge" class="absolute top-0 right-0 bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider">
                Stretching
            </div>

            <h2 id="ex-name" class="text-2xl sm:text-3xl font-bold mb-2">Nome Esercizio</h2>
            <div class="flex items-center gap-2 mb-4">
                <span class="text-xs uppercase tracking-wide text-gray-500 font-bold">Target:</span>
                <span id="ex-target" class="text-sm bg-gray-700 px-2 py-1 rounded text-emerald-300">Muscoli</span>
            </div>
            
            <div class="bg-gray-900/50 p-4 rounded-lg border-l-4 border-emerald-500">
                <p id="ex-notes" class="text-gray-300 text-sm leading-relaxed">
                    Note tecniche dell'esercizio.
                </p>
            </div>
        </div>

        <!-- Timer Display -->
        <div class="flex justify-center items-center mb-8">
            <div id="timer-display" class="timer-idle flex justify-center items-center w-48 h-48 sm:w-64 sm:h-64 rounded-full border-4 text-6xl sm:text-7xl font-extrabold bg-gray-800 shadow-2xl transition-colors duration-300">
                00:45
            </div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-4 gap-3 w-full">
            <button id="btn-reset" onclick="app.resetTimer()" class="bg-gray-700 hover:bg-gray-600 rounded-xl py-4 flex flex-col items-center justify-center transition-colors">
                <i class="fa-solid fa-rotate-left text-xl mb-1"></i>
                <span class="text-xs uppercase tracking-wider font-bold">Reset</span>
            </button>
            
            <button id="btn-play-pause" onclick="app.togglePlayPause()" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl py-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50 transition-colors">
                <i id="icon-play-pause" class="fa-solid fa-play text-2xl mb-1"></i>
                <span id="text-play-pause" class="text-xs uppercase tracking-wider font-bold">Inizia</span>
            </button>
            
            <button id="btn-next" onclick="app.nextStep()" class="bg-gray-700 hover:bg-gray-600 rounded-xl py-4 flex flex-col items-center justify-center transition-colors">
                <i class="fa-solid fa-forward-step text-xl mb-1"></i>
                <span class="text-xs uppercase tracking-wider font-bold">Salta</span>
            </button>
        </div>
    </div>

    <!-- COMPLETION SCREEN -->
    <div id="completion-screen" class="w-full max-w-md hidden flex-col items-center justify-center text-center py-12">
        <div class="w-24 h-24 bg-emerald-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(16,185,129,0.5)]">
            <i class="fa-solid fa-check text-5xl text-white"></i>
        </div>
        <h2 class="text-3xl font-bold mb-2">Recupero Completato!</h2>
        <p class="text-gray-400 mb-8">Ottimo lavoro. Il sistema nervoso parasimpatico ringrazia.</p>
        <button onclick="app.goBack()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl font-bold transition-colors w-full">
            Torna alla Home
        </button>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        // Data Structure
        const routinesData = {
            'Torso A': [
                { name: "Stretching Pettorali alla Porta", duration: 45, target: "Gran Pettorale", note: "Gomito a 90° appoggiato al montante, ruota il busto all'esterno senza inarcare la schiena. ⚠️ RIPETI PER LATO." },
                { name: "Child's Pose", duration: 45, target: "Gran Dorsale", note: "In ginocchio, bacino sui talloni, allunga le braccia in avanti." },
                { name: "Stretching Deltoide Laterale", duration: 30, target: "Deltoide Laterale", note: "Porta il braccio teso al petto e bloccalo. ⚠️ RIPETI PER LATO." },
                { name: "Cobra Pose Leggero", duration: 30, target: "Addominali", note: "Sdraiato a pancia in giù, spingi sulle mani estendendo il busto. Non comprimere la lombare." }
            ],
            'Limbs A': [
                { name: "Stretching Ischiocrurali", duration: 45, target: "Catena Posteriore", note: "Gamba stesa, piegati in avanti dal bacino senza curvare la schiena. ⚠️ RIPETI PER LATO." },
                { name: "Stretching Quadricipite", duration: 30, target: "Quadricipite", note: "Porta il tallone al gluteo in piedi o a terra. Retroverti leggermente il bacino. ⚠️ RIPETI PER LATO." },
                { name: "Stretching Bicipiti a Parete", duration: 30, target: "Bicipiti", note: "Appoggia la mano al muro con le dita all'indietro e ruota le spalle. ⚠️ RIPETI PER LATO." },
                { name: "Stretching Tricipiti", duration: 30, target: "Tricipiti", note: "Gomito dietro la testa spinto verso il basso. ⚠️ RIPETI PER LATO." }
            ],
            'Torso B': [
                { name: "Stretching Pettorale a Terra", duration: 45, target: "Pettorali / Dorsali", note: "In ginocchio di fronte a una panca, appoggia i gomiti e spingi il petto verso il pavimento." },
                { name: "Doorway Lat Stretch", duration: 30, target: "Gran Dorsale", note: "Afferra un montante con una mano e spingi il bacino all'indietro. ⚠️ RIPETI PER LATO." },
                { name: "Thread the Needle", duration: 30, target: "Deltoide Posteriore", note: "In quadrupedia, infila un braccio sotto il busto appoggiando spalla e tempia a terra. ⚠️ RIPETI PER LATO." },
                { name: "Cat-Cow", duration: 45, target: "Colonna Vertebrale", note: "Movimento fluido guidato dalla respirazione per decomprimere i dischi." }
            ],
            'Limbs B': [
                { name: "Cavalcatore (Psoas Stretch)", duration: 45, target: "Illiopsoas", note: "In affondo con ginocchio posteriore a terra, spingi il bacino in avanti (addome attivo). ⚠️ RIPETI PER LATO." },
                { name: "Stretching Glutei (Figura 4)", duration: 45, target: "Piriforme / Grande Gluteo", note: "Sdraiato, incrocia la caviglia sul ginocchio opposto e tira verso il petto. ⚠️ RIPETI PER LATO." },
                { name: "Stretching Bicipiti e Spalle", duration: 30, target: "Bicipiti / Spalle", note: "Mani intrecciate dietro la schiena, apri il petto e solleva le braccia." },
                { name: "Stretching Polpacci a Parete", duration: 30, target: "Gastrocnemio / Soleo", note: "Gamba posteriore tesa, tallone a terra, spingi il bacino verso il muro. ⚠️ RIPETI PER LATO." }
            ]
        };

        const REST_DURATION = 10; // 10 seconds transition between exercises

        const app = {
            activeRoutine: [],
            currentStepIndex: 0,
            
            // Timer state
            timeLeft: 0,
            timerInterval: null,
            isRunning: false,
            isResting: false,
            
            // Audio Context (initialized on user interaction)
            audioCtx: null,

            // DOM Elements
            el: {
                selector: document.getElementById('selector-screen'),
                dashboard: document.getElementById('dashboard-screen'),
                completion: document.getElementById('completion-screen'),
                
                exName: document.getElementById('ex-name'),
                exTarget: document.getElementById('ex-target'),
                exNotes: document.getElementById('ex-notes'),
                progress: document.getElementById('progress-indicator'),
                phaseBadge: document.getElementById('phase-badge'),
                
                timerDisplay: document.getElementById('timer-display'),
                btnPlayPause: document.getElementById('btn-play-pause'),
                iconPlayPause: document.getElementById('icon-play-pause'),
                textPlayPause: document.getElementById('text-play-pause')
            },

            initAudio() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            },

            beep(frequency, duration) {
                if (!this.audioCtx) return;
                const oscillator = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime); // Volume
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, duration);
            },

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            updateUI() {
                this.el.timerDisplay.innerText = this.formatTime(this.timeLeft);
                
                // Update Badge and Styles based on state
                this.el.timerDisplay.className = 'flex justify-center items-center w-48 h-48 sm:w-64 sm:h-64 rounded-full border-4 text-6xl sm:text-7xl font-extrabold shadow-2xl transition-colors duration-300 ';
                
                if (this.isResting) {
                    this.el.phaseBadge.innerText = 'PREPARAZIONE';
                    this.el.phaseBadge.className = 'absolute top-0 right-0 bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider';
                    this.el.timerDisplay.classList.add(this.isRunning ? 'timer-rest' : 'timer-paused');
                } else {
                    this.el.phaseBadge.innerText = 'STRETCHING';
                    this.el.phaseBadge.className = 'absolute top-0 right-0 bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider';
                    if (!this.isRunning && this.timeLeft === this.activeRoutine[this.currentStepIndex].duration) {
                        this.el.timerDisplay.classList.add('timer-idle');
                    } else if (!this.isRunning) {
                        this.el.timerDisplay.classList.add('timer-paused');
                    } else {
                        this.el.timerDisplay.classList.add('timer-active');
                    }
                }

                // Play/Pause button state
                if (this.isRunning) {
                    this.el.iconPlayPause.className = 'fa-solid fa-pause text-2xl mb-1';
                    this.el.textPlayPause.innerText = 'Pausa';
                    this.el.btnPlayPause.className = 'col-span-2 bg-amber-600 hover:bg-amber-500 rounded-xl py-4 flex flex-col items-center justify-center shadow-lg shadow-amber-900/50 transition-colors';
                } else {
                    this.el.iconPlayPause.className = 'fa-solid fa-play text-2xl mb-1';
                    this.el.textPlayPause.innerText = this.timeLeft === this.activeRoutine[this.currentStepIndex]?.duration ? 'Inizia' : 'Riprendi';
                    this.el.btnPlayPause.className = 'col-span-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl py-4 flex flex-col items-center justify-center shadow-lg shadow-emerald-900/50 transition-colors';
                }
            },

            selectRoutine(routineName) {
                this.activeRoutine = routinesData[routineName];
                this.currentStepIndex = 0;
                this.isResting = true; // Start with a prep phase
                this.timeLeft = REST_DURATION; 
                this.isRunning = false;
                
                this.el.selector.classList.add('hidden');
                this.el.dashboard.classList.remove('hidden');
                this.el.dashboard.classList.add('flex');
                this.el.completion.classList.add('hidden');
                
                this.loadStepData();
            },

            loadStepData() {
                const step = this.activeRoutine[this.currentStepIndex];
                this.el.exName.innerText = step.name;
                this.el.exTarget.innerText = step.target;
                
                // Highlight warning for bilateral exercises
                let notesHtml = step.note;
                if(notesHtml.includes('⚠️')) {
                    notesHtml = notesHtml.replace('⚠️ RIPETI PER LATO.', '<br><span class="text-amber-400 font-bold mt-2 inline-block"><i class="fa-solid fa-triangle-exclamation"></i> RIPETI PER LATO. Fai ripartire il timer per l\'altro lato.</span>');
                }
                this.el.exNotes.innerHTML = notesHtml;
                
                this.el.progress.innerText = `Esercizio ${this.currentStepIndex + 1} di ${this.activeRoutine.length}`;
                this.updateUI();
            },

            togglePlayPause() {
                this.initAudio(); // Required to unlock audio on first click
                
                if (this.isRunning) {
                    this.pause();
                } else {
                    this.play();
                }
            },

            play() {
                this.isRunning = true;
                this.timerInterval = setInterval(() => this.tick(), 1000);
                this.updateUI();
            },

            pause() {
                this.isRunning = false;
                clearInterval(this.timerInterval);
                this.updateUI();
            },

            resetTimer() {
                this.pause();
                const step = this.activeRoutine[this.currentStepIndex];
                this.isResting = false;
                this.timeLeft = step.duration;
                this.updateUI();
            },

            nextStep() {
                this.pause();
                if (this.currentStepIndex < this.activeRoutine.length - 1) {
                    this.currentStepIndex++;
                    this.isResting = true;
                    this.timeLeft = REST_DURATION;
                    this.loadStepData();
                    this.play(); // Auto-start next step
                } else {
                    this.completeRoutine();
                }
            },

            tick() {
                if (this.timeLeft > 0) {
                    this.timeLeft--;
                    
                    // Audio cues
                    if (this.timeLeft > 0 && this.timeLeft <= 3) {
                        this.beep(440, 150); // Warning beeps (A4)
                    } else if (this.timeLeft === 0) {
                        this.beep(880, 500); // Final long beep (A5)
                    }
                    
                    this.updateUI();
                } else {
                    // Time is up, switch state
                    clearInterval(this.timerInterval);
                    
                    if (this.isResting) {
                        // Move to stretching phase
                        this.isResting = false;
                        this.timeLeft = this.activeRoutine[this.currentStepIndex].duration;
                        this.timerInterval = setInterval(() => this.tick(), 1000);
                        this.updateUI();
                    } else {
                        // Stretching done, move to next step automatically
                        this.nextStep();
                    }
                }
            },

            completeRoutine() {
                this.el.dashboard.classList.add('hidden');
                this.el.dashboard.classList.remove('flex');
                this.el.completion.classList.remove('hidden');
                this.el.completion.classList.add('flex');
            },

            goBack() {
                this.pause();
                this.el.dashboard.classList.add('hidden');
                this.el.dashboard.classList.remove('flex');
                this.el.completion.classList.add('hidden');
                this.el.completion.classList.remove('flex');
                
                this.el.selector.classList.remove('hidden');
                this.el.selector.classList.add('flex');
            }
        };

        // Initialize state on load
        window.onload = () => {
            // Nothing to do until user selects a routine
        };
    </script>
</body>
</html>
